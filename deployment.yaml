apiVersion: apps/v1
kind: Deployment
metadata:
  name: edokter-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edokter-web
  template:
    metadata:
      labels:
        app: edokter-web
    spec:
      containers:
      - name: web
        image: php:8.2-apache
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: edokter-service
spec:
  type: NodePort
  selector:
    app: edokter-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
